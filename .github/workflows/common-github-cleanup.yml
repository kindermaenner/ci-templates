name: Cleanup old workflow data

on:
  workflow_call:
    inputs:
      workflow-runs-retention-days:
        description: "Keep workflow runs newer than this many days"
        required: false
        type: number
        default: 7
      artifacts-retention-days:
        description: "Keep artifacts newer than this many days"
        required: false
        type: number
        default: 7
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04

    steps:
      - name: Determine latest commit on default branch
        id: head
        uses: actions/github-script@v7
        with:
          script: |
            // Default branch ermitteln
            const repo = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const defaultBranch = repo.data.default_branch;

            // HEAD-Commit holen
            const branchInfo = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: defaultBranch
            });

            core.setOutput("head_sha", branchInfo.data.commit.sha);

      - name: Cleanup workflow runs (keep run for latest commit)
        uses: actions/github-script@v7
        with:
          script: |
            const headSha = "${{ steps.head.outputs.head_sha }}";
            const retentionDays = ${{ inputs.workflow-runs-retention-days || 7 }};

            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            // Run zum HEAD-Commit finden
            const headRun = runs.data.workflow_runs.find(r => r.head_sha === headSha);

            if (headRun) {
              console.log(`Keeping run ${headRun.id} for latest commit ${headSha}`);
            } else {
              console.log("No run found for latest commit — nothing to keep");
            }

            for (const run of runs.data.workflow_runs) {
              const ageDays = (Date.now() - new Date(run.created_at)) / 86400000;

              // Diesen Run niemals löschen
              if (headRun && run.id === headRun.id) {
                console.log(`Skipping run ${run.id} (latest commit)`);
                continue;
              }

              if (ageDays > retentionDays) {
                console.log(`Deleting run ${run.id} (${ageDays.toFixed(1)} days old)`);
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
              }
            }

      - name: Delete all caches
        uses: actions/github-script@v7
        with:
          script: |
            const caches = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            for (const cache of caches.data.actions_caches) {
              console.log(`Deleting cache ${cache.id}`);
              await github.rest.actions.deleteActionsCacheById({
                owner: context.repo.owner,
                repo: context.repo.repo,
                cache_id: cache.id
              });
            }

      - name: Delete old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const retentionDays = ${{ inputs.artifacts-retention-days || 7 }};

            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            for (const artifact of artifacts.data.artifacts) {
              const ageDays = (Date.now() - new Date(artifact.created_at)) / 86400000;
              if (ageDays > retentionDays) {
                console.log(`Deleting artifact ${artifact.id} (${artifact.name}, ${ageDays.toFixed(7)} days old)`);
                try {
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifact.id
                  });
                } catch (err) {
                  console.log(`Error deleting artifact ${artifact.id}: ${err.message}`);
                }
              }
            }

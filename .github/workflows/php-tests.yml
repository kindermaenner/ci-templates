name: PHP Tests

on:
  workflow_call:
    inputs:
      php-version:
        required: false
        type: string
        default: "8.2"
      coverage-file:
        required: false
        type: string
        default: "coverage.xml"
      upload-coverage:
        description: "Upload coverage artifact (disabled by default to prevent budget consumption)"
        required: false
        type: boolean
        default: false
      retention-days:
        description: "Retention days if coverage artifact is uploaded"
        required: false
        type: number
        default: 1

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          coverage: xdebug

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run Pest tests with coverage
        run: vendor/bin/pest --coverage --coverage-clover=coverage.xml --min=80

      - name: Upload coverage artifact
        if: ${{ inputs.upload-coverage }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ${{ inputs.coverage-file }}
          retention-days: ${{ inputs.retention-days }}

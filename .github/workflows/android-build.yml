name: Common Android Build

on:
  workflow_call:
    inputs:
      keystore-file:
        required: true
        type: string

      artifact-name:
        required: false
        type: string
        default: "android-build"

      build-type:
        required: false
        type: string
        default: "Debug" # Options: Debug, Release

      run-instrumented-tests:
        required: false
        type: boolean
        default: false

    secrets:
      RELEASE_KEYSTORE_BASE64:
        required: true
      RELEASE_KEYSTORE_PASSWORD:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable KVM group perms
        if: ${{ inputs.run-instrumented-tests }}
        run: |
          sudo chown $USER /dev/kvm

      - name: Free Disk Space (for Emulator)
        if: ${{ inputs.run-instrumented-tests }}
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          # Do NOT delete $AGENT_TOOLSDIRECTORY as it contains the JDK

      - name: Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Restore release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/${{ inputs.keystore-file }}"
          chmod 600 "$RUNNER_TEMP/${{ inputs.keystore-file }}"

      - name: Build + Lint + Coverage
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=true"
          RELEASE_KEYSTORE: ${{ runner.temp }}/${{ inputs.keystore-file }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew \
            assemble${{ inputs.build-type }} \
            lint \
            koverXmlReport \
            --stacktrace

      - name: Instrumented Tests + Coverage
        if: ${{ inputs.run-instrumented-tests }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTestCoverageReport --stacktrace

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            **/lint-results*.xml
            **/report.xml
            **/connectedDebugAndroidTestCoverageReport.xml

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: app/build/outputs/**/*.apk


name: Organization Actions Cleanup

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would be deleted"
        type: boolean
        required: true
        default: true
  schedule:
    # Every Sunday at 04:17 UTC
    - cron: "17 4 * * 0"

permissions: {}

concurrency:
  group: organization-actions-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Clean old runs and caches
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GH_TOKEN: ${{ secrets.ORG_CLEANUP_TOKEN }}
      ORG: kindermaenner
      # Scheduled runs are dry-run until the repository variable
      # CLEANUP_DRY_RUN is explicitly set to "false".
      DRY_RUN: ${{ github.event_name == 'schedule' && vars.CLEANUP_DRY_RUN != 'false' || inputs.dry_run }}

    steps:
      - name: Check configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::Missing secret ORG_CLEANUP_TOKEN"
            exit 1
          fi
          echo "Organization: $ORG"
          echo "Dry run: ${DRY_RUN:-false}"

      - name: Clean old workflow runs and caches
        shell: bash
        run: |
          set -euo pipefail

          CUTOFF="$(date -u -d '7 days ago' '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Cutoff: $CUTOFF"
          echo "Listing repositories in $ORG ..."

          gh api --paginate \
            "orgs/$ORG/repos?type=all&per_page=100" \
            | jq -r '.[].name' \
            | while IFS= read -r REPO; do
                [[ -z "$REPO" ]] && continue
                echo ""
                echo "=== Repository: $REPO ==="

                # 1. Delete completed workflow runs older than 7 days.
                gh api --paginate \
                  "repos/$ORG/$REPO/actions/runs?status=completed&per_page=100" \
                  | jq -r --arg cutoff "$CUTOFF" \
                    '.workflow_runs[] | select(.created_at < $cutoff) | .id' \
                  | while IFS= read -r RUN_ID; do
                      [[ -z "$RUN_ID" ]] && continue
                      echo "Old workflow run: $RUN_ID"
                      if [[ "${DRY_RUN:-false}" == "true" ]]; then
                        echo "  DRY RUN: would delete run"
                      else
                        gh api --method DELETE \
                          "repos/$ORG/$REPO/actions/runs/$RUN_ID"
                        echo "  Deleted run $RUN_ID"
                      fi
                    done

                # 2. Delete caches not accessed in the last 7 days.
                gh api --paginate \
                  "repos/$ORG/$REPO/actions/caches?per_page=100" \
                  | jq -r --arg cutoff "$CUTOFF" \
                    '.actions_caches[]
                     | select(.last_accessed_at != null
                              and .last_accessed_at < $cutoff)
                     | .id' \
                  | while IFS= read -r CACHE_ID; do
                      [[ -z "$CACHE_ID" ]] && continue
                      echo "Old cache: $CACHE_ID"
                      if [[ "${DRY_RUN:-false}" == "true" ]]; then
                        echo "  DRY RUN: would delete cache"
                      else
                        gh api --method DELETE \
                          "repos/$ORG/$REPO/actions/caches/$CACHE_ID"
                        echo "  Deleted cache $CACHE_ID"
                      fi
                    done
              done

          echo ""
          echo "Cleanup scan finished."

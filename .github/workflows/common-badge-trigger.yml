name: Common Badge Trigger

on:
  workflow_call:
    inputs:
      project-key:
        required: false
        type: string
    secrets:
      BADGE_APP_ID:
        required: true
      BADGE_APP_PRIVATE_KEY:
        required: true

jobs:
  update-badges:
    runs-on: ubuntu-latest

    steps:
      - name: Determine project key
        id: project
        run: |
          if [ -z "${{ inputs.project-key }}" ]; then
            echo "value=${{ github.event.repository.name }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ inputs.project-key }}" >> $GITHUB_OUTPUT
          fi

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BADGE_APP_ID }}
          private-key: ${{ secrets.BADGE_APP_PRIVATE_KEY }}
          owner: kindermaenner
          repositories: sonar-badges
          permission-actions: write

      - name: Trigger badge generation
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/kindermaenner/sonar-badges/actions/workflows/update.yml/dispatches \
            -d "{
              \"ref\": \"main\",
              \"inputs\": {
                \"project\": \"${{ steps.project.outputs.value }}\"
              }
            }"

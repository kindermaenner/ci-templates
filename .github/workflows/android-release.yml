name: Android Release

on:
  workflow_call:
    inputs:
      app-slug:
        description: "App package/binary slug name (e.g. monatsblitz)"
        required: true
        type: string

      keystore-file:
        description: "Filename of the keystore to restore"
        required: true
        type: string

      java-version:
        description: "JDK version to use"
        required: false
        type: string
        default: "21"

      run-unit-tests:
        description: "Whether to run unit tests before building the release"
        required: false
        type: boolean
        default: true

      run-ftp-upload:
        description: "Whether to upload built APKs to FTP"
        required: false
        type: boolean
        default: true

      ftp-target-path:
        description: "Base target directory on the FTP server (e.g. kindermaenner.de/app-downloads/monatsblitz)"
        required: false
        type: string
        default: ""

      release-title-prefix:
        description: "Prefix for the GitHub release title (e.g. 'Monatsblitz App')"
        required: false
        type: string
        default: ""

    secrets:
      RELEASE_KEYSTORE_BASE64:
        required: true
      RELEASE_KEYSTORE_PASSWORD:
        required: true
      RELEASE_KEY_ALIAS:
        required: false
      FTP_HOST:
        required: false
      FTP_USER:
        required: false
      FTP_PASSWORD:
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Build, sign and publish Android release
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+(\.[0-9]+)*(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tags must start with 'v' followed by version digits (e.g. v1.0.0)."
            exit 1
          fi

      - name: Extract version details
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Berechne numerischen versionCode aus SemVer
          IFS='.' read -r major minor patch <<< "$VERSION"
          major=$(echo "${major:-0}" | grep -o -E '[0-9]+' | head -n1 || echo 0)
          minor=$(echo "${minor:-0}" | grep -o -E '[0-9]+' | head -n1 || echo 0)
          patch=$(echo "${patch:-0}" | grep -o -E '[0-9]+' | head -n1 || echo 0)
          VERSION_CODE=$(( major * 10000 + minor * 100 + patch ))
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Version: $VERSION (Code: $VERSION_CODE)"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: platform-tools

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses

      - name: Gradle Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-release-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Run Unit Tests
        if: ${{ inputs.run-unit-tests }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Restore release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/${{ inputs.keystore-file }}"
          chmod 600 "$RUNNER_TEMP/${{ inputs.keystore-file }}"

      - name: Resolve Key Alias
        id: keystore
        shell: bash
        run: |
          KEY_ALIAS="${{ secrets.RELEASE_KEY_ALIAS }}"
          if [ -z "$KEY_ALIAS" ]; then
            DETECTED_ALIAS=$(keytool -list -keystore "$RUNNER_TEMP/${{ inputs.keystore-file }}" -storepass "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" | grep "PrivateKeyEntry" | head -n 1 | cut -d',' -f1 | xargs || true)
            if [ -n "$DETECTED_ALIAS" ]; then
              KEY_ALIAS="$DETECTED_ALIAS"
            else
              KEY_ALIAS="${{ inputs.app-slug }}"
            fi
          fi
          echo "key_alias=$KEY_ALIAS" >> $GITHUB_OUTPUT
          echo "Resolved Signing Key Alias: $KEY_ALIAS"

      - name: Build Release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=true"
          RELEASE_KEYSTORE: ${{ runner.temp }}/${{ inputs.keystore-file }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ steps.keystore.outputs.key_alias }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PversionName=${{ steps.version.outputs.version }} \
            -PversionCode=${{ steps.version.outputs.version_code }} \
            --stacktrace

      - name: Prepare Release Artifacts
        shell: bash
        env:
          APP_SLUG: ${{ inputs.app-slug }}
        run: |
          mkdir -p build/dist
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" ! -name "*-androidTest.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No release APK found in app/build/outputs/apk/release!"
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" "build/dist/${APP_SLUG}.apk"
          cp "$APK_FILE" "build/dist/${APP_SLUG}-${GITHUB_REF_NAME}.apk"

          cd build/dist
          sha256sum "${APP_SLUG}.apk" > "${APP_SLUG}.apk.sha256"
          sha256sum "${APP_SLUG}-${GITHUB_REF_NAME}.apk" > "${APP_SLUG}-${GITHUB_REF_NAME}.apk.sha256"
          ls -la

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: ${{ inputs.release-title-prefix || inputs.app-slug }}
        run: |
          TITLE="$PREFIX $GITHUB_REF_NAME"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Uploading artifacts to existing release $GITHUB_REF_NAME"
            gh release upload "$GITHUB_REF_NAME" build/dist/* --clobber
          else
            echo "Creating new release $GITHUB_REF_NAME"
            gh release create "$GITHUB_REF_NAME" \
              --title "$TITLE" \
              --generate-notes \
              build/dist/*
          fi

      - name: Publish latest APK to FTP
        if: ${{ inputs.run-ftp-upload && inputs.ftp-target-path != '' }}
        uses: kindermaenner/ci-templates/.github/actions/ftp-upload@main
        with:
          source-path: build/dist/${{ inputs.app-slug }}.apk
          target-path: ${{ inputs.ftp-target-path }}/latest
          ftp-host: ${{ secrets.FTP_HOST }}
          ftp-user: ${{ secrets.FTP_USER }}
          ftp-password: ${{ secrets.FTP_PASSWORD }}

      - name: Publish versioned APK to FTP
        if: ${{ inputs.run-ftp-upload && inputs.ftp-target-path != '' }}
        uses: kindermaenner/ci-templates/.github/actions/ftp-upload@main
        with:
          source-path: build/dist/${{ inputs.app-slug }}-${{ github.ref_name }}.apk
          target-path: ${{ inputs.ftp-target-path }}/versions/${{ github.ref_name }}
          ftp-host: ${{ secrets.FTP_HOST }}
          ftp-user: ${{ secrets.FTP_USER }}
          ftp-password: ${{ secrets.FTP_PASSWORD }}

name: "SonarQube Gradle Scan"
description: "Executes SonarQube Scan via Gradle directly on the runner without artifact upload/download"

inputs:
  sonar-token:
    description: "SonarQube Authentication Token"
    required: false
    default: ""
  sonar-host-url:
    description: "SonarQube Server Host URL"
    required: false
    default: ""
  gradle-args:
    description: "Additional Gradle CLI arguments"
    required: false
    default: "--no-configuration-cache --stacktrace"

runs:
  using: "composite"
  steps:
    - name: Set up Java 21
      if: ${{ inputs.sonar-token != '' && inputs.sonar-host-url != '' }}
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21

    - name: Check SonarQube connectivity
      if: ${{ inputs.sonar-token != '' && inputs.sonar-host-url != '' }}
      shell: bash
      env:
        SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
        SONAR_TOKEN: ${{ inputs.sonar-token }}
      run: |
        url="${SONAR_HOST_URL%/}/api/v2/analysis/version"
        if result=$(curl --silent --show-error --output /dev/null \
          --write-out 'HTTP %{http_code}; connect %{time_connect}s; total %{time_total}s' \
          --connect-timeout 10 --max-time 20 --user "${SONAR_TOKEN}:" "$url"); then
          echo "SonarQube connectivity check: $result"
        else
          curl_status=$?
          echo "::warning::SonarQube connectivity check failed (curl exit code ${curl_status})."
        fi

    - name: Run SonarQube Scan via Gradle
      shell: bash
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
        SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
      run: |
        if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_HOST_URL" ]; then
          echo "Warning: SONAR_TOKEN or SONAR_HOST_URL is not set. Skipping SonarQube Gradle Scan."
          exit 0
        fi
        chmod +x gradlew
        ./gradlew sonar ${{ inputs.gradle-args }} -Dsonar.scanner.skipJreProvisioning=true -Dsonar.scanner.socketTimeout=300

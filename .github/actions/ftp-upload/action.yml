name: "FTP Upload"
description: "Uploads build files directly to an FTP server via curl without creating GitHub artifacts"

inputs:
  source-path:
    description: "Source directory, file, or glob pattern to upload (e.g. app/build/outputs/**/*.apk)"
    required: true
  exclude-pattern:
    description: "Optional Bash filename pattern for files to skip (e.g. *-androidTest.apk)"
    required: false
    default: ""
  target-path:
    description: "Target directory on the FTP server"
    required: true
  ftp-host:
    description: "FTP Server Host"
    required: false
    default: ""
  ftp-user:
    description: "FTP Username"
    required: false
    default: ""
  ftp-password:
    description: "FTP Password"
    required: false
    default: ""
  fail-on-error:
    description: "Fail instead of skipping when credentials or source files are missing"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Perform FTP upload
      shell: bash
      env:
        FTP_HOST: ${{ inputs.ftp-host }}
        FTP_USER: ${{ inputs.ftp-user }}
        FTP_PASSWORD: ${{ inputs.ftp-password }}
        SOURCE_PATH: ${{ inputs.source-path }}
        EXCLUDE_PATTERN: ${{ inputs.exclude-pattern }}
        TARGET_PATH: ${{ inputs.target-path }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
      run: |
        if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ]; then
          if [ "$FAIL_ON_ERROR" = "true" ]; then
            echo "::error::FTP credentials or host are not configured."
            exit 1
          fi
          echo "Warning: FTP credentials/host not configured. Skipping FTP upload."
          exit 0
        fi

        shopt -s globstar nullglob
        SRC="$SOURCE_PATH"
        DST="$TARGET_PATH"

        echo "Starting FTP upload from: $SRC to target: $DST"

        FILES=()
        if [ -f "$SRC" ]; then
          FILES+=("$SRC")
        elif [ -d "$SRC" ]; then
          while IFS= read -r -d '' file; do
            FILES+=("$file")
          done < <(find "$SRC" -type f -print0)
        else
          for file in $SRC; do
            if [ -f "$file" ]; then
              FILES+=("$file")
            fi
          done
        fi

        if [ ${#FILES[@]} -eq 0 ]; then
          if [ "$FAIL_ON_ERROR" = "true" ]; then
            echo "::error::No files found to upload matching '$SRC'."
            exit 1
          fi
          echo "Warning: No files found to upload matching '$SRC'"
        else
          for FILE in "${FILES[@]}"; do
            BASENAME=$(basename "$FILE")
            if [[ -n "$EXCLUDE_PATTERN" && "$BASENAME" == $EXCLUDE_PATTERN ]]; then
              echo "Skipping excluded file: $FILE"
              continue
            fi
            TARGET_PATH="$DST/$BASENAME"
            echo "Uploading $FILE -> $TARGET_PATH"
            curl --fail --ftp-ssl --ftp-create-dirs \
              --user "$FTP_USER:$FTP_PASSWORD" \
              --upload-file "$FILE" \
              "ftp://$FTP_HOST/$TARGET_PATH"
          done
          echo "FTP upload completed successfully (${#FILES[@]} files uploaded)."
        fi

name: "SonarQube CLI Scan"
description: "Executes SonarQube CLI scanner directly on the runner without artifact upload/download"

inputs:
  sonar-properties:
    description: "SonarQube scanner properties (e.g. -Dsonar.projectKey=...)"
    required: false
    default: ""
  sonar-token:
    description: "SonarQube Authentication Token"
    required: false
    default: ""
  sonar-host-url:
    description: "SonarQube Server Host URL"
    required: false
    default: ""
  scanner-version:
    description: "SonarScanner CLI version to use"
    required: false
    default: "8.0.1.6346"

runs:
  using: "composite"
  steps:
    - name: Cache SonarQube scanner
      uses: actions/cache@v5
      with:
        path: /opt/sonar-scanner
        key: sonar-scanner-${{ runner.os }}-${{ inputs.scanner-version }}

    - name: Cache SonarQube plugins
      uses: actions/cache@v5
      with:
        path: ~/.sonar/cache
        key: sonar-cache-${{ runner.os }}

    - name: Resolve SonarQube project version
      id: project-version
      if: ${{ inputs.sonar-token != '' && inputs.sonar-host-url != '' }}
      uses: kindermaenner/ci-templates/.github/actions/sonar-project-version@main

    - name: Install SonarScanner CLI
      shell: bash
      run: |
        if [ -z "${{ inputs.sonar-token }}" ] || [ -z "${{ inputs.sonar-host-url }}" ]; then
          echo "Sonar credentials missing, skipping installation."
          exit 0
        fi
        if [ ! -f "/opt/sonar-scanner/bin/sonar-scanner" ]; then
          echo "Downloading SonarScanner CLI ${{ inputs.scanner-version }}..."
          wget -q https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${{ inputs.scanner-version }}-linux-x64.zip
          unzip -q sonar-scanner-cli-${{ inputs.scanner-version }}-linux-x64.zip
          sudo rm -rf /opt/sonar-scanner
          sudo mv sonar-scanner-${{ inputs.scanner-version }}-linux-x64 /opt/sonar-scanner
          rm -f sonar-scanner-cli-${{ inputs.scanner-version }}-linux-x64.zip
        fi
        echo "/opt/sonar-scanner/bin" >> $GITHUB_PATH

    - name: Run SonarQube Scan
      shell: bash
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
        SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
        SONAR_PROJECT_VERSION: ${{ steps.project-version.outputs.project-version }}
        SONAR_PROPERTIES: ${{ inputs.sonar-properties }}
      run: |
        if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_HOST_URL" ]; then
          echo "Warning: SONAR_TOKEN or SONAR_HOST_URL is not set. Skipping SonarQube CLI Scan."
          exit 0
        fi
        sonar_properties=()
        while IFS= read -r line; do
          if [ -n "$line" ]; then
            read -r -a line_properties <<< "$line"
            sonar_properties+=("${line_properties[@]}")
          fi
        done <<< "$SONAR_PROPERTIES"
        if [ -n "$SONAR_PROJECT_VERSION" ]; then
          sonar_properties+=("-Dsonar.projectVersion=$SONAR_PROJECT_VERSION")
        fi
        if [ "${#sonar_properties[@]}" -gt 0 ]; then
          /opt/sonar-scanner/bin/sonar-scanner "${sonar_properties[@]}"
        else
          /opt/sonar-scanner/bin/sonar-scanner
        fi
